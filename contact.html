<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | BlogFootball</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <h1>BlogFootball</h1>
      <p>Berita & Hasil Sepak Bola Terbaru</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-container">
    <h2>Hubungi Kami</h2>
    <p>Isi formulir di bawah untuk mengirim pesan atau saran kepada kami.</p>

    <form action="https://formspree.io/f/xyzbljaw" method="POST" class="contact-form">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" placeholder="Nama kamu" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="_replyto" placeholder="Alamat email" required />

      <label for="pesan">Pesan:</label>
      <textarea id="pesan" name="pesan" placeholder="Tulis pesanmu di sini..." required></textarea>

      <button type="submit">Kirim</button>

      <p id="formStatus"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 BlogFootball. Semua hak dilindungi.</p>
  </footer>

  <script>
    const form = document.querySelector(".contact-form");
    const statusText = document.getElementById("formStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      statusText.textContent = "Mengirim...";
      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" }
        });
        if (response.ok) {
          statusText.textContent = "✅ Pesan berhasil dikirim!";
          form.reset();
        } else {
          statusText.textContent = "⚠️ Gagal mengirim pesan. Coba lagi nanti.";
        }
      } catch (error) {
        statusText.textContent = "❌ Terjadi kesalahan koneksi.";
      }
    });
  </script>
</body>
</html>
